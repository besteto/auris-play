<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#14100e">
<!-- This page carries a real person's face, full name and birthday. It is meant
     to be handed to him, not found. Keep this tag: on a GitHub Pages project site
     a robots.txt at the repo root is NOT read by crawlers (they only read it from
     the domain root, i.e. <user>.github.io/robots.txt), so this meta tag is the
     part that actually works. -->
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<title>AURIS · Play</title>
<link rel="icon" href="assets/logo/mark-gold.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ══ TITLE ══════════════════════════════════════════════════════════════ -->
<section id="screen-title" class="screen is-on">
  <div class="title-inner">
    <img class="title-logo" src="assets/logo/auris-stack-light.png" alt="AURIS">
    <p class="title-edition" data-i18n="title.edition">Studio&nbsp;Edition</p>
    <div class="title-rule"></div>
    <nav class="title-menu">
      <button class="btn btn-gold" data-act="play-endless" data-i18n="btn.play">Играть</button>
      <button class="btn" data-act="play-demo" data-i18n="btn.demo">Коллекция</button>
      <button class="btn" data-act="collections" data-i18n="btn.collections">Коллекции</button>
      <button class="btn btn-quiet" data-act="board" data-i18n="btn.board">Рекорды</button>
      <button class="btn btn-quiet" data-act="manual" data-i18n="btn.manual">Как играть</button>
      <button class="lang-toggle" data-act="lang">RU / EN</button>
    </nav>
  </div>
</section>

<!-- ══ GAME ═══════════════════════════════════════════════════════════════ -->
<section id="screen-game" class="screen">
  <header class="hud">
    <button class="icon-btn" data-act="home" data-i18n-aria="aria.menu" aria-label="В меню">‹</button>

    <div class="hud-score">
      <span id="score">0</span>
    </div>

    <button class="icon-btn" data-act="mute" data-i18n-aria="aria.sound" aria-label="Звук"><span id="mute-glyph">♪</span></button>
    <button class="btn btn-stop" data-act="stop" data-i18n="btn.stop">Стоп</button>
  </header>

  <!-- set progress pips -->
  <div class="set-pips" id="set-pips"></div>

  <div class="tray-frame">
    <div class="tray" id="tray"></div>
  </div>

  <footer class="game-foot">
    <button class="pouch" data-act="pouch">
      <img src="assets/logo/mark-gold.png" alt="">
      <span data-i18n="pouch"></span>
    </button>
  </footer>

  <div class="toast" id="toast" hidden></div>
</section>

<!-- ══ SET PLATE (overlay) ════════════════════════════════════════════════ -->
<div id="set-plate" class="overlay" hidden>
  <article class="plate catalogue">
    <img class="plate-mark" src="assets/logo/mark-dark.png" alt="AURIS">
    <p class="plate-eyebrow" id="set-plate-eyebrow"></p>
    <figure class="cat-shot"><img id="set-plate-shot" src="" alt=""></figure>
    <h1 class="cat-title" id="set-plate-title"></h1>
    <p class="cat-ref" id="set-plate-ref"></p>
    <div class="cat-rule"></div>
    <p class="cat-body" id="set-plate-body"></p>
    <dl class="cat-specs" id="set-plate-specs"></dl>
  </article>
</div>

<!-- ══ COLLECTION PLATE — the demo ending ═════════════════════════════════ -->
<section id="screen-collection-plate" class="screen">
  <article class="plate catalogue">
    <img class="plate-mark" src="assets/logo/mark-dark.png" alt="AURIS">
    <p class="plate-eyebrow" data-i18n="plate.eyebrow">Auris</p>
    <figure class="cat-shot"><img id="coll-plate-hero" src="" alt=""></figure>
    <h1 class="cat-title" id="coll-plate-title"></h1>
    <div class="cat-rule"></div>
    <p class="cat-body" id="coll-plate-body"></p>
    <nav class="cat-menu">
      <button class="btn btn-gold" data-act="demo-again" data-i18n="btn.again">Ещё раз</button>
      <button class="btn" data-act="contacts" data-i18n="btn.contacts">Контакты</button>
      <button class="btn btn-quiet" data-act="home" data-i18n="btn.menu">В меню</button>
    </nav>
  </article>
</section>

<!-- ══ INITIALS ═══════════════════════════════════════════════════════════ -->
<section id="screen-initials" class="screen">
  <article class="plate">
    <p class="plate-eyebrow" data-i18n="initials.eyebrow">Ваш результат</p>
    <h2 class="plate-title" data-i18n="initials.title">Три буквы</h2>
    <p class="initials-score"><span id="initials-score">0</span></p>
    <div class="initials-slots">
      <button class="initials-slot is-on" data-slot="0">А</button>
      <button class="initials-slot" data-slot="1">А</button>
      <button class="initials-slot" data-slot="2">А</button>
    </div>
    <div class="initials-pad" id="initials-pad"></div>
    <nav class="cat-menu">
      <button class="btn btn-gold" data-act="initials-ok" data-i18n="btn.ok">Готово</button>
      <button class="btn btn-quiet" data-act="board" data-i18n="btn.skip">Пропустить</button>
    </nav>
  </article>
</section>

<!-- ══ BOARD ══════════════════════════════════════════════════════════════ -->
<section id="screen-board" class="screen">
  <article class="plate">
    <button class="plate-close" data-act="home" aria-label="×">×</button>
    <p class="plate-eyebrow" data-i18n="board.eyebrow">Auris</p>
    <h2 class="plate-title" data-i18n="board.title">Рекорды дня</h2>
    <ol class="board-list" id="board-list"></ol>
    <p class="board-note" data-i18n="board.note">Доска обнуляется каждый день.</p>
    <nav class="cat-menu">
      <button class="btn btn-gold" data-act="play-endless" data-i18n="btn.again">Ещё раз</button>
      <button class="btn btn-quiet" data-act="home" data-i18n="btn.menu">В меню</button>
    </nav>
  </article>
</section>

<!-- ══ CONTACTS ═══════════════════════════════════════════════════════════ -->
<section id="screen-contacts" class="screen">
  <article class="plate">
    <button class="plate-close" data-act="home" aria-label="×">×</button>
    <p class="plate-eyebrow" data-i18n="contacts.eyebrow">Auris</p>
    <h2 class="plate-title" data-i18n="contacts.title">Забрать с собой</h2>
    <ul class="qr-list">
      <li>
        <img class="qr" id="qr-auris" src="assets/qr/auris.png" alt="">
        <img class="qr-mark" src="assets/logo/auris-horiz-dark.png" alt="AURIS">
        <span data-i18n="contacts.auris">украшения</span>
      </li>
      <li>
        <img class="qr" src="assets/qr/scalpelburg.png" alt="">
        <img class="qr-mark" src="assets/logo/scalpelburg.png" alt="Scalpelburg">
        <span data-i18n="contacts.scalpelburg">студия пирсинга</span>
      </li>
    </ul>
    <nav class="cat-menu">
      <button class="btn btn-quiet" data-act="home" data-i18n="btn.menu">В меню</button>
    </nav>
  </article>
</section>

<!-- ══ COLLECTIONS ════════════════════════════════════════════════════════ -->
<section id="screen-collections" class="screen">
  <article class="plate collections">
    <button class="plate-close" data-act="home" data-i18n-aria="aria.close" aria-label="Закрыть">×</button>
    <img class="plate-mark" src="assets/logo/mark-dark.png" alt="AURIS">
    <p class="plate-eyebrow" data-i18n="collections.eyebrow"></p>
    <h2 class="plate-title" data-i18n="collections.title"></h2>

    <div id="collection-list"></div>

    <div class="cat-rule"></div>

    <section class="boutique">
      <p class="boutique-head" data-i18n="collections.boutique"></p>
      <img class="boutique-shot" src="assets/bg/studio.jpg" data-i18n-alt="alt.scalpelburg" alt="Студия Scalpelburg">
      <ul class="boutique-links">
        <li>
          <a class="boutique-link" href="https://scalpelburg.com/" target="_blank" rel="noopener">
            <img class="boutique-mark-scalpel" src="assets/logo/scalpelburg.png" alt="Scalpelburg">
            <span data-i18n="collections.scalpelburg"></span>
          </a>
        </li>
        <li>
          <a class="boutique-link" href="https://aurisjewellery.com/" target="_blank" rel="noopener">
            <img class="boutique-mark-auris" src="assets/logo/auris-horiz-dark.png" alt="AURIS">
            <span data-i18n="collections.auris"></span>
          </a>
        </li>
      </ul>
    </section>

    <nav class="cat-menu">
      <button class="btn btn-quiet" data-act="home" data-i18n="btn.menu">В меню</button>
    </nav>
  </article>
</section>

<!-- ══ INSTRUCTION PLATE ══════════════════════════════════════════════════ -->
<div id="manual" class="overlay" hidden>
  <article class="plate manual">
    <button class="plate-close" data-act="close-manual" data-i18n-aria="aria.close" aria-label="Закрыть">×</button>
    <p class="plate-eyebrow" data-i18n="manual.eyebrow"></p>
    <h2 class="plate-title" data-i18n="manual.title"></h2>

    <ol class="steps">
      <li><b>1.</b> <span data-i18n="manual.1"></span></li>
      <li><b>2.</b> <span data-i18n="manual.2"></span></li>
      <li><b>3.</b> <span data-i18n="manual.3"></span></li>
      <li><b>4.</b> <span data-i18n="manual.4"></span></li>
      <li><b>5.</b> <span data-i18n="manual.5"></span>
        <span class="nowrap">•&ensp;••&ensp;•••</span></li>
      <li><b>6.</b> <span data-i18n="manual.6"></span></li>
      <li><b>7.</b> <span data-i18n="manual.7"></span></li>
      <li><b>8.</b> <span data-i18n="manual.8"></span></li>
    </ol>
  </article>
</div>

<script src="src/rules.js"></script>
<script src="src/sfx.js"></script>
<script src="data/collections.js"></script>
<script src="data/copy.js"></script>
<script src="src/manifest.js"></script>
<script src="src/board.js"></script>
<script src="src/game.js"></script>
</body>
</html>
