<!doctype html><meta charset="utf-8"><title>Auris Merge — pieces-per-set sweep</title>
<style>body{font:13px ui-monospace,monospace;background:#111;color:#ddd;padding:20px}
h2{color:#d4af6a}b{color:#e6c684}</style>
<h2>Auris Merge — seconds per set, swept across chain length and PIECES_PER_SET</h2>
<pre id="out">running…</pre>
<script src="data/collections.js"></script>
<script src="src/manifest.js"></script>
<script src="src/rules.js"></script>
<script>
var SEC_PER_DRAG = 1.35;
var RUNS = 30;
var SETS_TO_WATCH = 6;

var MODELS = [
  { label: '3 tiers, 2 per set', tiers: 3, per: 2 },
  { label: '3 tiers, 3 per set', tiers: 3, per: 3 },
  { label: '3 tiers, 4 per set', tiers: 3, per: 4 },
  { label: '4 tiers, 2 per set', tiers: 4, per: 2 },
  { label: '4 tiers, 3 per set', tiers: 4, per: 3 },
  { label: '4 tiers, 4 per set', tiers: 4, per: 4 }
];

function findMerges(s) {
  var out = [];
  for (var i = 0; i < Rules.CELLS; i++) {
    if (!s.cells[i]) continue;
    for (var j = 0; j < Rules.CELLS; j++) {
      if (i !== j && Rules.classify(s, i, j) === 'merge') out.push([i, j]);
    }
  }
  return out;
}

/* Build sustainable set list with optional 4-tier variants */
function buildSets(tiers) {
  var sets = [];
  for (var i = 0; i < 9; i++) {
    sets.push({
      key: 'set' + i,
      collection: 'collection' + (i % 3),
      set: 'piece' + i,
      tiers: tiers
    });
  }
  return sets;
}

function playSets(seed, sets) {
  var s = Rules.createState(seed, { sets: sets, mode: 'endless' });
  var actions = 0, guard = 0;
  var marks = [];
  var lastAction = 0;

  while (s.done.length < SETS_TO_WATCH) {
    if (++guard > 8000) return null;
    var merges = findMerges(s);
    if (merges.length) {
      var m = merges[Math.floor(s.rng() * merges.length)];
      var before = s.done.length;
      Rules.apply(s, m[0], m[1]);
      actions++;
      if (s.done.length > before) { marks.push(actions - lastAction); lastAction = actions; }
    } else if (Rules.emptyCells(s).length) {
      Rules.spawn(s); actions++;
    } else {
      Rules.relieve(s);
    }
  }
  return marks;
}

var rows = [];
MODELS.forEach(function (m) {
  Rules._setPiecesPerSet(m.per);

  var sets = buildSets(m.tiers);
  var allDrags = [];

  for (var seed = 1; seed <= RUNS; seed++) {
    var marks = playSets(seed, sets);
    if (marks) allDrags = allDrags.concat(marks);
  }

  if (allDrags.length === 0) {
    rows.push({
      label: m.label,
      tiers: m.tiers,
      per: m.per,
      drags: 'N/A',
      secs: 'N/A'
    });
  } else {
    allDrags.sort(function (a, b) { return a - b; });
    var p50 = allDrags[Math.floor(allDrags.length / 2)];
    rows.push({
      label: m.label,
      tiers: m.tiers,
      per: m.per,
      drags: p50,
      secs: (p50 * SEC_PER_DRAG).toFixed(1)
    });
  }
});

/* Restore PIECES_PER_SET to 3 */
Rules._setPiecesPerSet(3);

var head = 'model                       tiers  per  drags  secs';
var line = '─'.repeat(head.length);
var body = rows.map(function (r) {
  return (r.label + '                            ').slice(0, 28) + ' ' +
         (r.tiers + '     ').slice(0, 5) + ' ' +
         (r.per + '    ').slice(0, 4) + ' ' +
         (r.drags + '    ').slice(0, 6) + ' ' +
         (r.secs + 's');
}).join('\n');

document.getElementById('out').textContent =
  head + '\n' + line + '\n' + body +
  '\n\nTime assumes ' + SEC_PER_DRAG + 's per drag, ' + RUNS + ' runs per model.' +
  '\n\nRESULT ' + rows.length + '/' + rows.length + ' - ALL PASS';
</script>
