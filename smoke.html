<!doctype html><meta charset="utf-8"><title>Auris Merge — set retirement measurement</title>
<style>body{font:13px ui-monospace,monospace;background:#111;color:#ddd;padding:20px}h2{color:#d4af6a}</style>
<h2>Auris Merge — 100 endless runs, 6 sets per run</h2><pre id="out"></pre>
<script src="data/collections.js"></script>
<script src="src/manifest.js"></script>
<script src="src/rules.js"></script>
<script>
var R = Rules, lines = [], pass = 0, fail = 0;
function ok(name, cond, extra) {
  if (cond) { pass++; lines.push('  ok  ' + name); }
  else { fail++; lines.push('FAIL  ' + name + (extra ? '  <- ' + extra : '')); }
}

var SETS_TO_WATCH = 6;
var SEC_PER_DRAG = 1.35;

function findMerges(s) {
  var out = [];
  for (var i = 0; i < R.CELLS; i++) {
    if (!s.cells[i]) continue;
    for (var j = 0; j < R.CELLS; j++) {
      if (i !== j && R.classify(s, i, j) === 'merge') out.push([i, j]);
    }
  }
  return out;
}

function playSets(seed) {
  var order = Manifest.endlessOrder(Collections, R.mulberry32(seed));
  var s = R.createState(seed, { sets: order, mode: 'endless' });
  var actions = 0, pouch = 0, relieved = 0, guard = 0;
  var marks = [];
  var lastAction = 0;
  var shortTray = 0;
  var retirements = 0;

  while (retirements < SETS_TO_WATCH) {
    if (++guard > 8000) return null;
    if (s.tray.length !== 3) shortTray++;
    var merges = findMerges(s);
    if (merges.length) {
      var m = merges[Math.floor(s.rng() * merges.length)];
      var events = R.apply(s, m[0], m[1]);
      actions++;
      for (var e = 0; e < events.length; e++) {
        if (events[e].type === 'setComplete') {
          retirements++;
          marks.push(actions - lastAction);
          lastAction = actions;
        }
      }
    } else if (R.emptyCells(s).length) {
      R.spawn(s); actions++; pouch++;
    } else {
      R.relieve(s); relieved++;
    }
  }
  return { actions: actions, pouch: pouch, relieved: relieved, shortTray: shortTray, perSet: marks };
}

var runs = [], broken = 0, jams = 0, shortTrayCount = 0;
for (var seed = 1; seed <= 100; seed++) {
  var r = playSets(seed);
  if (!r) { broken++; continue; }
  runs.push(r);
  if (r.relieved > 0) jams += r.relieved;
  if (r.shortTray > 0) shortTrayCount++;
}

ok('every run retired six sets without stalling', broken === 0, broken + ' stalled');
ok('the tray was never left short of three sets', shortTrayCount === 0);

var per = [].concat.apply([], runs.map(function (r) { return r.perSet; }))
             .sort(function (a, b) { return a - b; });
var p50 = per[Math.floor(per.length / 2)];
var secPerSet = p50 * SEC_PER_DRAG;

ok('median seconds per set falls between 10 and 18',
   secPerSet >= 10 && secPerSet <= 18,
   'median ' + p50 + ' drags = ' + secPerSet.toFixed(1) + 's per set');

ok('a three-set demo run stays under 90 seconds',
   p50 * 3 * SEC_PER_DRAG <= 90,
   '3 sets = ' + (p50 * 3 * SEC_PER_DRAG).toFixed(0) + 's');

ok('the anti-jam rule is a safety net, not the norm',
   jams / runs.length < 1.0, (jams / runs.length).toFixed(2) + ' unjams per run');

document.getElementById('out').textContent =
  lines.join('\n') +
  '\n\ndrags per set:  min ' + per[0] + '   median ' + p50 + '   mean ' + (Math.round(per.reduce(function (a, b) { return a + b; }, 0) / per.length)) + '   max ' + per[per.length - 1] +
  '\nat ' + SEC_PER_DRAG + 's/drag: median ' + secPerSet.toFixed(1) + 's per set' +
  '\npouch taps:  mean ' + (runs.reduce(function (a, r) { return a + r.pouch; }, 0) / runs.length).toFixed(1) +
  '\nunjams:      ' + (jams / runs.length).toFixed(2) + ' per run' +
  '\n\nRESULT ' + pass + '/' + (pass + fail) + (fail ? ' - ' + fail + ' FAILED' : ' - ALL PASS');
</script>
